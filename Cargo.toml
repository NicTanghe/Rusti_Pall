[package]
name = "rusty_pall"
version = "0.1.0"
edition = "2024"
default-run = "rusty_pall"

[dependencies]
burn = { version = "0.20.1", default-features = false, features = ["std", "ndarray", "wgpu"] }
burn-store = { version = "0.20.1", default-features = false, features = ["std", "pytorch"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openusd = "=0.7.0"
openusd-schemas = { version = "=0.7.0", features = ["geom", "skel"] }
anyhow = "1"
nalgebra = "0.34"
candle-core = "=0.9.2"
candle-nn = "=0.9.2"
candle-transformers = "=0.9.2"
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
